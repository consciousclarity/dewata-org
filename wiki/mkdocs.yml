site_name: dewata.org wiki (knowledge base)
site_description: Multilingual knowledge base for dewata.org. The wiki explains terms
  and how the engine/proof/evidence workflow works; it is not a source of calendar
  authority.
site_url: https://wiki.dewata.org/
repo_url: https://github.com/consciousclarity/dewata-org/
repo_name: consciousclarity/dewata-org
docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true
validation:
  absolute_links: ignore
  links:
    not_found: ignore
theme:
  name: material
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - toc.follow
  - content.code.copy
plugins:
- search
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc:
    permalink: false
