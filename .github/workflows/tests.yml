name: tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # No dependency cache is enabled: the project does not yet carry a
      # hash-locked Python dependency file, so sharing mutable package cache
      # state would not meet this workflow's evidence-integrity boundary.
      - name: Install declared test dependencies
        working-directory: phase-1
        run: python -m pip install -e '.[dev]'

      - name: Retrieve pinned non-vendored LGPL evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/refs
          curl --fail --location --silent --show-error \
            --output /tmp/refs/sakacalendar.java \
            https://raw.githubusercontent.com/edysantosa/sakacalendar/21ff347c0431cb12e02296f76077aa40525da9e0/src/main/com/edysantosa/sakacalendar/SakaCalendar.java
          echo 'dda574c4d0434c9fcc35fa60fa700e1ae1f8e7b5eafc88d20346ed93d5687579  /tmp/refs/sakacalendar.java' | sha256sum --check --strict

      - name: Run complete repository test suite
        working-directory: phase-1
        run: python -m pytest -q -rs
